; ============================================================
;  ESP32 Runtime OS  –  PlatformIO project configuration
;
;  Two board environments share the EXACT same source tree.
;  Only these flags change when you swap hardware.
;  Build a specific env:  pio run -e wrover_ili9341
; ============================================================

[platformio]
default_envs = wrover_ili9341

; ── shared settings every env inherits ──────────────────────
[env]
platform  = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; compiler: treat warnings as useful noise, not errors
build_flags =
    -Wall
    -Wextra
    -std=gnu++17
    ; load all TFT_eSPI fonts (small overhead, very useful later)
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1


; ── Board A : ESP32-WROVER  +  ILI9341  (240×320) ───────────
[env:wrover_ili9341]
board = esp32dev

build_flags =
    ${env.build_flags}

    ; tell our HAL which board this is
    -D BOARD_WROVER_ILI9341

    ; ── TFT_eSPI driver selection ──
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320

    ; ── SPI pins (standard ESP32 VSPI) ──
    ; These match the Wokwi diagram.json wiring below.
    ; Change only these four lines if your physical board differs.
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_MISO=19
    -D TFT_CS=5
    -D TFT_DC=2
    -D TFT_RST=4

    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000

    ; ── PSRAM (WROVER has 4 MB) ──
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

board_build.partitions = default.csv


; ── Board B : ESP32-S3 Supermini  +  GC9A01  (240×240) ──────
